<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <title>{{ shop.shop_name }} - QR se Print</title>
    <style>
        body { font-family: sans-serif; background: #f3f4f6; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .poster { background: #ffffff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); width: 400px; text-align: center; border: 2px solid #1e293b; }
        h1 { font-size: 24px; color: #1e293b; margin-bottom: 5px; }
        .qr-box img { width: 200px; height: 200px; border: 2px solid #cbd5e1; border-radius: 8px; margin: 15px 0; }
        .footer-box { background: #1e293b; color: white; padding: 10px; border-radius: 6px; margin-top: 15px; font-size: 14px; }
        .btn-reg { background: #2563eb; color: white; padding: 10px 20px; border-radius: 6px; text-decoration: none; font-weight: bold; display: inline-block; margin-bottom: 15px; }
    </style>
</head>
<body>

<div class="poster">
    <!-- Register Button -->
    <a href="/register" class="btn-reg">+ Register Your Shop</a>

    <h1>QR se PRINT</h1>
    <p style="font-size: 13px; font-weight: bold; color: #475569;">SCAN • UPLOAD • PAY • PRINT</p>
    
    <div class="qr-box">
        <img src="{{ shop.qr_image_url }}" alt="Shop QR Code">
    </div>

    <div class="footer-box">
        <b>{{ shop.shop_name }}</b><br>
        <span style="font-size: 12px;">{{ shop.address }}</span>
    </div>
</div>

</body>
</html>
