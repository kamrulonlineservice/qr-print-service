<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kamrul Online Service - Edit</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #f8fafc; margin: 0; padding: 10px; display: flex; justify-content: center; }
        .container { background: #fff; padding: 15px; border-radius: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); width: 100%; max-width: 450px; border: 2px solid #3b82f6; margin-top: 5px; }
        
        .header-title { font-size: 16px; font-weight: bold; color: #1e3a8a; margin-bottom: 2px; display: flex; justify-content: space-between; align-items: center; }
        .header-sub { font-size: 11px; color: #64748b; margin-bottom: 8px; }
        
        .steps { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 11px; font-weight: bold; color: #64748b; background: #f1f5f9; padding: 8px; border-radius: 10px; text-align: center; }
        .steps span.active { color: #16a34a; }
        
        /* Swipe Nav Bar */
        .swipe-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; background: #e2e8f0; padding: 8px 12px; border-radius: 12px; font-size: 13px; font-weight: bold; color: #1e3a8a; }
        .swipe-btn { background: #1e3a8a; color: #fff; border: none; padding: 6px 14px; border-radius: 8px; cursor: pointer; font-size: 12px; font-weight: bold; }
        .swipe-btn:hover { background: #1d4ed8; }

        /* Preview Container */
        .preview-container { position: relative; background: #f1f5f9; border: 2px solid #cbd5e1; border-radius: 14px; padding: 4px; text-align: center; margin-bottom: 10px; height: 340px; display: flex; justify-content: center; align-items: center; overflow: hidden; }
        .preview-container img { max-width: 100%; max-height: 100%; object-fit: contain; }
        
        /* Manual Page Selection Box */
        .manual-select-box { background: #eff6ff; border: 1.5px solid #93c5fd; padding: 10px; border-radius: 12px; margin-bottom: 10px; }
        .manual-select-box label { font-size: 12px; font-weight: bold; color: #1e3a8a; display: block; margin-bottom: 4px; }
        .manual-select-input { width: 100%; padding: 8px; font-size: 14px; border: 1px solid #3b82f6; border-radius: 8px; outline: none; background: #fff; color: #1e3a8a; font-weight: bold; text-align: center; }
        .manual-select-hint { font-size: 10px; color: #64748b; margin-top: 4px; display: block; text-align: center; }

        /* Bottom Buttons */
        .btn-group { display: flex; gap: 8px; margin-top: 5px; }
        .btn-back { background: #e2e8f0; color: #334155; border: none; padding: 12px; font-size: 13px; font-weight: bold; border-radius: 10px; width: 35%; cursor: pointer; text-align: center; text-decoration: none; }
        .btn-continue { background: #16a34a; color: #fff; border: none; padding: 12px; font-size: 13px; font-weight: bold; border-radius: 10px; width: 65%; cursor: pointer; text-align: center; box-shadow: 0 4px 10px rgba(22, 163, 74, 0.3); }
    </style>
</head>
<body>
<div class="container">
    <div class="header-title">
        <span>🖨️ Kamrul Online Service</span>
        <a href="/" style="font-size: 11px; color: #ef4444; text-decoration: none; font-weight: bold;">❌ Cancel</a>
    </div>
    <div class="header-sub">Document Preview & Page Selection</div>
    
    <div class="steps">
        <span>1. Upload ✓</span>
        <span class="active">2. Select & Edit ✓</span>
        <span>3. Preview</span>
        <span>4. Pay</span>
    </div>

    <!-- Swipe Nav -->
    <div class="swipe-nav">
        <button type="button" class="swipe-btn" onclick="changePage(-1)">◀ Prev</button>
        <span id="pageIndicator">Page 1 of {{ pages | length }}</span>
        <button type="button" class="swipe-btn" onclick="changePage(1)">Next ▶</button>
    </div>

    <!-- Preview Container -->
    <div class="preview-container">
        <img id="previewImg" src="/uploads/{{ pages[0] }}" alt="Page Preview">
    </div>

    <!-- Manual Page Selection Box (Direct Input) -->
    <div class="manual-select-box">
        <label for="pagesInput">📝 কোন কোন পেজ প্রিন্ট করবেন লিখুন:</label>
        <input type="text" id="pagesInput" name="pages_input" form="editForm" class="manual-select-input" value="1-{{ pages | length }}" placeholder="e.g. 1, 3, 5-7">
        <span class="manual-select-hint">কমা দিয়ে (2, 4, 7) অথবা রেঞ্জ দিয়ে (1-5) লিখতে পারেন</span>
    </div>

    <!-- Form Navigation -->
    <form action="/preview" method="POST" id="editForm">
        <input type="hidden" name="filename" value="{{ filename }}">
        <input type="hidden" name="display_filename" id="hiddenDisplayFilename" value="{{ pages[0] }}">
        <input type="hidden" name="customer_phone" value="{{ customer_phone }}">
        
        <div class="btn-group">
            <a href="/" class="btn-back">← Back</a>
            <button type="submit" class="btn-continue">✅ Save & Continue</button>
        </div>
    </form>
</div>

<script>
    const pageList = {{ pages | tojson }};
    let currentIndex = 0;

    function changePage(direction) {
        currentIndex += direction;
        if (currentIndex < 0) currentIndex = 0;
        if (currentIndex >= pageList.length) currentIndex = pageList.length - 1;

        const currentPageFile = pageList[currentIndex];
        
        const img = document.getElementById('previewImg');
        img.src = "/uploads/" + currentPageFile;
        document.getElementById('hiddenDisplayFilename').value = currentPageFile;
        document.getElementById('pageIndicator').innerText = `Page ${currentIndex + 1} of ${pageList.length}`;
    }
</script>
</body>
</html>
