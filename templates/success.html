<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Successful - QR Print Service</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #FFFBF7;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #1c1917;
        }
        .success-card {
            background: #ffffff;
            padding: 2.5rem;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            text-align: center;
            max-width: 400px;
            width: 90%;
            border: 1px solid #e7e5e4;
        }
        .icon-circle {
            width: 70px;
            height: 70px;
            background: #d1e7dd;
            color: #0f5132;
            font-size: 35px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.5rem auto;
        }
        h2 { margin: 0 0 10px 0; color: #0f5132; font-size: 24px; }
        p { color: #57534e; font-size: 14px; line-height: 1.5; margin-bottom: 1.5rem; }
        .btn-home {
            background: #2563eb;
            color: white;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 9999px;
            font-weight: 700;
            font-size: 14px;
            box-shadow: 0 4px 10px rgba(37, 99, 235, 0.2);
            display: inline-block;
        }
        .btn-home:hover { background: #1d4ed8; }
    </style>
</head>
<body>
    <div class="success-card">
        <div class="icon-circle">✓</div>
        <h2>Payment Successful!</h2>
        <p>আপনার পেমেন্ট সফলভাবে সম্পন্ন হয়েছে। আপনার প্রিন্ট জবটি রিয়েল-টাইমে দোকানদারের প্রিন্ট কিউতে পাঠানো হয়েছে। খুব শীঘ্রই প্রিন্ট হয়ে যাবে!</p>
        <a href="/" class="btn-home">Back to Home</a>
    </div>
</body>
</html>
