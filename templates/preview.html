<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kamrul Online Service - Preview</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #f8fafc; margin: 0; padding: 10px; display: flex; justify-content: center; }
        .container { background: #fff; padding: 15px; border-radius: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); width: 100%; max-width: 450px; border: 2px solid #3b82f6; margin-top: 5px; }
        
        .header-box { background: linear-gradient(135deg, #1e3a8a, #3b82f6); color: white; padding: 12px; border-radius: 12px; text-align: center; margin-bottom: 10px; }
        .header-box h2 { margin: 0; font-size: 16px; }
        .header-box p { margin: 3px 0 0; font-size: 11px; opacity: 0.9; }

        .steps { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 11px; font-weight: bold; color: #64748b; background: #f1f5f9; padding: 8px; border-radius: 10px; text-align: center; }
        .steps span.active { color: #16a34a; }

        .section-title { font-size: 13px; font-weight: bold; color: #1e3a8a; margin-bottom: 6px; display: flex; justify-content: space-between; align-items: center; }
        
        .preview-container { background: #f1f5f9; border: 2px solid #cbd5e1; border-radius: 14px; padding: 4px; text-align: center; margin-bottom: 12px; height: 320px; display: flex; justify-content: center; align-items: center; overflow: hidden; }
        /* Default grayscale for Black & White */
        .preview-container img { max-width: 100%; max-height: 100%; object-fit: contain; filter: grayscale(100%); transition: filter 0.3s ease; }

        .print-options { background: #f8fafc; border: 1px solid #e2e8f0; padding: 10px; border-radius: 12px; margin-bottom: 12px; display: flex; gap: 10px; }
        .print-option-card { flex: 1; border: 2px solid #cbd5e1; border-radius: 10px; padding: 8px; text-align: center; cursor: pointer; background: #fff; }
        .print-option-card.selected { border-color: #3b82f6; background: #eff6ff; }
        .print-option-card input { display: none; }
        .print-option-card h4 { margin: 0 0 3px; font-size: 12px; color: #1e3a8a; }
        .print-option-card p { margin: 0; font-size: 11px; color: #64748b; font-weight: bold; }

        .btn-group { display: flex; gap: 8px; }
        .btn-back { background: #e2e8f0; color: #334155; border: none; padding: 12px; font-size: 13px; font-weight: bold; border-radius: 10px; width: 35%; cursor: pointer; text-align: center; text-decoration: none; }
        .btn-continue { background: #16a34a; color: #fff; border: none; padding: 12px; font-size: 13px; font-weight: bold; border-radius: 10px; width: 65%; cursor: pointer; text-align: center; box-shadow: 0 4px 10px rgba(22, 163, 74, 0.3); }
    </style>
</head>
<body>
<div class="container">
    <div class="header-box">
        <h2>Kamrul Online Service</h2>
        <p>Goroimari, Morigaon, Assam</p>
    </div>
    
    <div class="steps">
        <span>1. Upload ✓</span>
        <span>2. Edit ✓</span>
        <span class="active">3. Preview ✓</span>
        <span>4. Pay</span>
    </div>

    <div class="section-title">
        <span>Print Preview & Options</span>
        <span style="background: #e0f2fe; color: #0369a1; padding: 3px 8px; border-radius: 6px; font-size: 11px;">{{ total_pages }} Pages Selected</span>
    </div>

    <div class="preview-container">
        <img id="previewImg" src="/uploads/{{ display_filename }}" alt="Preview" style="filter: grayscale(100%);">
    </div>

    <form action="/pay" method="POST">
        <input type="hidden" name="filename" value="{{ filename }}">
        <input type="hidden" name="customer_phone" value="{{ customer_phone }}">
        <input type="hidden" name="total_pages" value="{{ total_pages }}">
        {% for p in selected_pages %}
        <input type="hidden" name="selected_pages" value="{{ p }}">
        {% endfor %}

        <div class="print-options">
            <label class="print-option-card selected" id="bwCard" onclick="setPrintType('bw')">
                <input type="radio" name="print_type" value="bw" checked>
                <h4>Black & White</h4>
                <p>₹5/page</p>
            </label>
            <label class="print-option-card" id="colorCard" onclick="setPrintType('color')">
                <input type="radio" name="print_type" value="color">
                <h4>Color</h4>
                <p>₹10/page</p>
            </label>
        </div>

        <div class="btn-group">
            <a href="javascript:history.back()" class="btn-back">← Back</a>
            <button type="submit" class="btn-continue">✅ Continue (₹ <span id="totalAmount">{{ total_pages * 5 }}</span>)</button>
        </div>
    </form>
</div>

<script>
    let rate = 5;
    const totalPages = {{ total_pages }};

    function setPrintType(type) {
        const bwCard = document.getElementById('bwCard');
        const colorCard = document.getElementById('colorCard');
        const previewImg = document.getElementById('previewImg');
        
        if(type === 'bw') {
            bwCard.classList.add('selected');
            colorCard.classList.remove('selected');
            bwCard.querySelector('input').checked = true;
            rate = 5;
            previewImg.style.filter = 'grayscale(100%)';
        } else {
            colorCard.classList.add('selected');
            bwCard.classList.remove('selected');
            colorCard.querySelector('input').checked = true;
            rate = 10;
            previewImg.style.filter = 'none';
        }
        document.getElementById('totalAmount').innerText = totalPages * rate;
    }
</script>
</body>
</html>
