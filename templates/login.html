<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <title>লগইন - QR Se Print</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 350px; }
        h2 { text-align: center; color: #333; }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
        button:hover { background: #218838; }
        p { text-align: center; }
    </style>
</head>
<body>
    <div class="card">
        <h2>দোকানদার লগইন</h2>
        <form method="POST">
            <input type="email" name="email" placeholder="ইমেইল অ্যাড্রেস" required>
            <input type="password" name="password" placeholder="পাসওয়ার্ড" required>
            <button type="submit">লগইন</button>
        </form>
        <p>অ্যাকাউন্ট নেই? <a href="/register">রেজিস্ট্রেশন করুন</a></p>
    </div>
</body>
</html>
