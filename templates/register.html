<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <title>Shop Registration - QR se Print</title>
    <style>
        body { font-family: sans-serif; background: #f8fafc; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .register-box { max-width: 400px; width: 100%; padding: 25px; border: 1px solid #cbd5e1; border-radius: 10px; background: #ffffff; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h3 { color: #1e293b; text-align: center; margin-bottom: 20px; }
        label { font-size: 14px; font-weight: bold; color: #475569; display: block; margin-bottom: 5px; }
        input { width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; }
        button { background: #2563eb; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; }
        button:hover { background: #1d4ed8; }
    </style>
</head>
<body>

<div class="register-box">
    <h3>Shop Registration</h3>
    <form method="POST">
        <label>দোকানের নাম (Shop Name):</label>
        <input type="text" name="shop_name" placeholder="যেমন: Kamrul Online Service" required>

        <label>দোকানদারের নাম (Owner Name):</label>
        <input type="text" name="owner_name" placeholder="আপনার নাম" required>

        <label>পূর্ণ ঠিকানা (Address):</label>
        <input type="text" name="address" placeholder="গ্রাম, পোস্ট, জেলা" required>

        <label>আপনার পেমেন্ট UPI ID (যেমন: 9876543210@paytm):</label>
        <input type="text" name="upi_id" placeholder="UPI ID দিন" required>

        <button type="submit">সিস্টেম চালু করুন</button>
    </form>
</div>

</body>
</html>
