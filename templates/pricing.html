<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Set Print Pricing</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 400px; }
        h2 { margin-bottom: 20px; color: #333; font-size: 20px; text-align: center; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #555; }
        input[type="number"] { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        button { background: #28a745; color: white; border: none; padding: 10px 15px; width: 100%; border-radius: 5px; font-size: 16px; cursor: pointer; font-weight: bold; }
        button:hover { background: #218838; }
        .back-link { display: block; text-align: center; margin-top: 15px; text-decoration: none; color: #007bff; font-size: 14px; }
        .back-link:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <div class="card">
        <h2>₹ Set Print Pricing</h2>
        
        <form action="{{ url_for('shop_pricing', shop_id=shop.id) }}" method="POST">
            <div class="form-group">
                <label for="bw_rate">Black & White Rate (Per Page - ₹):</label>
                <input type="number" step="0.5" id="bw_rate" name="bw_rate" value="{{ shop.bw_rate }}" required>
            </div>

            <div class="form-group">
                <label for="color_rate">Color Rate (Per Page - ₹):</label>
                <input type="number" step="0.5" id="color_rate" name="color_rate" value="{{ shop.color_rate }}" required>
            </div>

            <button type="submit">Save Pricing</button>
        </form>

        <a href="{{ url_for('shop_dashboard', shop_id=shop.id) }}" class="back-link">← Back to Dashboard</a>
    </div>

</body>
</html>
