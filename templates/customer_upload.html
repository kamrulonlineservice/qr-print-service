<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Upload Document for Print - QR Se Print</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 380px; text-align: center; }
        h2 { color: #333; margin-bottom: 5px; }
        .shop-badge { background: #e9ecef; color: #007bff; padding: 5px 10px; border-radius: 4px; display: inline-block; margin-bottom: 20px; font-weight: bold; }
        input[type="file"] { width: 100%; padding: 10px; margin: 15px 0; border: 1px dashed #007bff; border-radius: 4px; box-sizing: border-box; background: #f8f9fa; cursor: pointer; }
        button { width: 100%; padding: 12px; background: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; font-weight: bold; }
        button:hover { background: #218838; }
        .error { color: #dc3545; margin-bottom: 10px; font-size: 14px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Print Document</h2>
        <div class="shop-badge">{{ shop_name }}</div>
        <p>Select your PDF or Image file to send for instant printing:</p>
        
        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}

        <form method="POST" enctype="multipart/form-data">
            <input type="file" name="file" accept=".pdf,.png,.jpg,.jpeg" required>
            <button type="submit">Upload & Print</button>
        </form>
    </div>
</body>
</html>
