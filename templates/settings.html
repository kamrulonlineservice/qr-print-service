<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Shop Settings</title>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: #e0e0e0; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #1e1e1e; padding: 30px; border-radius: 12px; box-shadow: 0 8px 20px rgba(0,0,0,0.5); width: 420px; border: 1px solid #333; }
        h2 { margin-bottom: 20px; color: #fff; font-size: 20px; text-align: center; border-bottom: 1px solid #333; padding-bottom: 10px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #bbb; font-size: 14px; }
        input[type="text"], input[type="email"] { width: 100%; padding: 10px; background: #2a2a2a; border: 1px solid #444; border-radius: 6px; color: #fff; box-sizing: border-box; font-size: 14px; }
        input:focus { border-color: #0d6efd; outline: none; }
        button { background: #0d6efd; color: white; border: none; padding: 12px; width: 100%; border-radius: 6px; font-size: 16px; cursor: pointer; font-weight: bold; transition: 0.3s; margin-top: 10px; }
        button:hover { background: #0b5ed7; }
        .back-link { display: block; text-align: center; margin-top: 15px; text-decoration: none; color: #6ea8fe; font-size: 14px; }
        .back-link:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <div class="card">
        <h2>⚙️ Shop Settings</h2>
        
        <form action="{{ url_for('shop_settings', shop_id=shop.id) }}" method="POST">
            <div class="form-group">
                <label for="shop_name">Shop Name:</label>
                <input type="text" id="shop_name" name="shop_name" value="{{ shop.shop_name }}" required>
            </div>

            <div class="form-group">
                <label for="owner_name">Owner Name:</label>
                <input type="text" id="owner_name" name="owner_name" value="{{ shop.owner_name }}" readonly style="background: #181818; color: #777; cursor: not-allowed;">
            </div>

            <div class="form-group">
                <label for="email">Email (Username):</label>
                <input type="email" id="email" name="email" value="{{ shop.email }}" readonly style="background: #181818; color: #777; cursor: not-allowed;">
            </div>

            <div class="form-group">
    <label>Country:</label>
    <input type="text" name="country" value="{{ shop.country }}" class="form-control">
</div>

<div class="form-group">
    <label>State:</label>
    <input type="text" name="state" value="{{ shop.state }}" class="form-control">
</div>

<div class="form-group">
    <label>District:</label>
    <input type="text" name="district" value="{{ shop.district }}" class="form-control">
</div>

<div class="form-group">
    <label>Village / Post Office:</label>
    <input type="text" name="village" value="{{ shop.village }}" class="form-control">
</div>

<div class="form-group">
    <label>Pincode:</label>
    <input type="text" name="pincode" value="{{ shop.pincode }}" class="form-control">
</div>

            <button type="submit">Save Changes</button>
        </form>

        <a href="{{ url_for('shop_dashboard', shop_id=shop.id) }}" class="back-link">← Back to Dashboard</a>
    </div>

</body>
</html>
