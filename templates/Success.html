<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <title>সফল আবেদন</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 50px; background: #f4f7f6; }
        .box { background: white; padding: 30px; border-radius: 8px; display: inline-block; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h3 { color: #28a745; }
        a { display: inline-block; margin-top: 20px; text-decoration: none; background: #007BFF; color: white; padding: 10px 20px; border-radius: 5px; }
    </style>
</head>
<body>
    <div class="box">
        <h3>ধন্যবাদ!</h3>
        <p>{{ message }}</p>
        <a href="/">আরেকটি প্রিন্ট করুন</a>
    </div>
</body>
</html>
